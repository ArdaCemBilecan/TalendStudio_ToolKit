[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talend-migration-toolkit"
version = "0.10.0"
description = "Dependency explorer for Talend Studio jobs: what a master job starts, reads and writes, and which database connections it uses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "networkx>=3.2",
    "typer>=0.12",
    "pydantic>=2.6",
    "sqlglot>=25.0",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7",
       "lxml-stubs", "types-PyYAML", "networkx-stubs", "pytz"]

[project.scripts]
tmt = "tmt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests", "tools"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501", "E741"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/tmt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tmt.lineage.builder", "tmt.lineage.svg", "tmt.lineage.explore"]
disallow_untyped_calls = false  # networkx is only partially typed

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true
